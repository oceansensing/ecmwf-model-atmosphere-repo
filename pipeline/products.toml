# What this repository publishes: ECMWF's open-data forecast fields — the 10 m wind, the 2 m and
# 850 hPa air temperatures, the cloud cover, the 500 hPa heights and (since 2026-11-22) the mean
# sea-level pressure from the IFS, and ECWAM's wave height — moved from `realtime-data-repo` on
# 2026-11-09 under the same root names. Both steps are one lane, `data.ecmwf.int`.

[contract]
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

[defaults]
timeout_minutes = 20

[steps.wind]
cmd = ["python3", "scripts/fetch-wind.py", "--only=wind,air,cloud,air-850,gh-500,hgt500-ecmwf,mslp-ecmwf"]
lane = "ecmwf"

[steps.waves]
cmd = ["python3", "scripts/fetch-waves.py"]
lane = "ecmwf"

# **Two days ahead and one behind, three-hourly** (2026-11-22, the site
# pipeline's D16): each grid's base lists the hours either side, the hours
# ahead from the base's run and the hours behind kept from earlier runs. The
# dated hours (`<root>.v<time>.json`) are R2's alone, kept there while a base
# lists them (`memory = "r2-kept"`). The contours are one hour, a product of
# their own with no window.
[products.wind]
title = "ECMWF 10 m wind, 2 m and 850 hPa temperature, cloud cover, sea-level pressure and 500 hPa heights"
step = "wind"
roots = ["wind.json", "air.json", "cloud.json", "air-850.json", "hgt500-ecmwf.json", "mslp-ecmwf.json"]
writes = ["wind*.json", "air*.json", "cloud*.json", "hgt500-ecmwf*.json", "mslp-ecmwf*.json"]
r2_only = ["hgt500-ecmwf*.json", "mslp-ecmwf*.json", "wind.v*.json", "air.v*.json", "cloud.v*.json",
           "air-850.v*.json"]
memory = "r2-kept"
hours_ahead = 48
hours_behind = 24
max_age_hours = 4
namespace = ["python3", "scripts/fetch-wind.py", "--namespace",
             "--only=wind,air,cloud,air-850,hgt500-ecmwf,mslp-ecmwf"]

[products.heights]
title = "ECMWF 500 hPa height contours"
step = "wind"
roots = ["gh-500.json"]
writes = ["gh-500.json"]
max_age_hours = 4
namespace = ["python3", "scripts/fetch-wind.py", "--namespace", "--only=gh-500"]

[products.waves]
title = "ECWAM significant wave height"
step = "waves"
roots = ["waves.json"]
writes = ["waves*.json"]
r2_only = ["waves.v*.json"]
memory = "r2-kept"
hours_ahead = 48
hours_behind = 24
max_age_hours = 4
namespace = ["python3", "scripts/fetch-waves.py", "--namespace"]
